<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Por o Shape</title>
<meta name="description" content="Acompanhe treinos, peso, medidas e fotos de progresso. Seus dados ficam só no seu aparelho.">
<meta name="theme-color" content="#0e6b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="brand">Por o Shape</div>
      <div class="status" id="status"><span class="dot"></span><span>Dados salvos neste aparelho</span></div>
    </div>
    <div class="hright"><button class="iconbtn" data-act="settings" aria-label="Ajustes"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button></div>
  </header>
  <main id="view"><div class="empty">Carregando seus dados…</div></main>
  <nav id="nav" aria-label="Seções"></nav>
</div>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:16px">Este app precisa de JavaScript para funcionar.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
